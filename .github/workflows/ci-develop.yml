name: CI & Auto-PR (Develop -> Main)

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  OCIR_REGISTRY: gru.ocir.io
  OCIR_REPO: gru.ocir.io/grmykw8bmw9d/management-api
  PREVIEW_URL: https://api-dev.ecolchain.com
  PROD_URL: https://api-prod.ecolchain.com
  CORS_ORIGIN: https://manage-dev.ecolchain.com

jobs:
  build-deploy-pr:
    name: Verify, Redeploy Dev & Auto PR to Main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Verify (tests + checks)
        run: ./mvnw -B -ntp clean verify

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no OCIR
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login "$OCIR_REGISTRY" \
            -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

      - name: Build & Push imagem linux/arm64 (dev + git-sha)
        run: |
          docker buildx build --platform linux/amd64 \
            -t "$OCIR_REPO:dev" \
            -t "$OCIR_REPO:${{ github.sha }}" \
            --push .

      - name: Smoke test dev (health + profile-types + preflight CORS)
        run: |
          echo "Aguardando deploy convergir (timer de pull ~2min)..."
          ok=0
          for i in $(seq 1 40); do
            h=$(curl -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL/q/health" || true)
            t=$(curl -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL/public/profile-types" || true)
            echo "tentativa $i: /q/health=$h /public/profile-types=$t"
            if [ "$h" = 200 ] && [ "$t" = 200 ]; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Smoke falhou: API dev nao respondeu 200 em ~7min"
            exit 1
          fi
          curl -sf -X OPTIONS "$PREVIEW_URL/public/profile-types" \
            -H "Origin: $CORS_ORIGIN" \
            -H "Access-Control-Request-Method: GET" \
            -D "$RUNNER_TEMP/preflight.h" -o /dev/null
          grep -qi "access-control-allow-origin: $CORS_ORIGIN" "$RUNNER_TEMP/preflight.h" \
            || { echo "::error::Preflight CORS sem allow-origin para $CORS_ORIGIN"; cat "$RUNNER_TEMP/preflight.h"; exit 1; }
          grep -qi "access-control-allow-credentials: true" "$RUNNER_TEMP/preflight.h" \
            || { echo "::error::Preflight CORS sem allow-credentials"; cat "$RUNNER_TEMP/preflight.h"; exit 1; }
          echo "Smoke OK: /q/health + /public/profile-types + preflight CORS credenciado"

      - name: Auto Create or Update PR to Main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY="🚀 **Release pronta para produção!**

          🔗 **URL de Produção:** [$PROD_URL]($PROD_URL)

          ---
          Preview desta build **antes do merge** (mesma imagem publicada em dev):
          🔗 [$PREVIEW_URL]($PREVIEW_URL)

          PR automático para promoção de versão de \`develop\` para \`main\`.
          ⚠️ **Atenção:** merge em \`main\` dispara o deploy de produção (push da tag \`prod\` no OCIR → container \`api-prod\` converge)."

          EXISTING_PR=$(gh pr list --head develop --base main --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            echo "Criando novo PR de develop para main..."
            gh pr create \
              --head develop \
              --base main \
              --title "release: promover alterações de develop para main" \
              --body "$PR_BODY" || echo "⚠️ Para criar PRs automáticos via GitHub Actions, ative a opção 'Allow GitHub Actions to create and approve pull requests' em Settings -> Actions -> General."
          else
            echo "Comentando PR #$EXISTING_PR..."
            gh pr comment "$EXISTING_PR" --body "🔄 **Nova build promovida para release!**\n\n🔗 **Produção (após merge):** [$PROD_URL]($PROD_URL)\n\n🔗 **Preview dev agora:** [$PREVIEW_URL]($PREVIEW_URL)" || true
          fi
