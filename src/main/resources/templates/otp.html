<!DOCTYPE html>
<html lang="{lang}">
<body style="font-family:Inter,Arial,sans-serif;background:#fdfbf6;color:#0e4330;padding:24px">
  <div style="max-width:480px;margin:auto;background:#fff;border:1px solid #e4f2ea;border-radius:12px;padding:32px">
    <h1 style="font-size:20px;margin:0 0 16px">ECOLchain</h1>
    {#if lang == 'en'}
    <p>Your sign-in code:</p>
    {:else}
    <p>Seu código de acesso:</p>
    {/if}
    <p style="font-size:32px;letter-spacing:8px;font-weight:700;color:#0a3a28;margin:16px 0">{code}</p>
    {#if lang == 'en'}
    <p style="color:#555">It expires in 10 minutes. If you did not request it, ignore this e-mail.</p>
    {:else}
    <p style="color:#555">Ele expira em 10 minutos. Se você não solicitou, ignore este e-mail.</p>
    {/if}
  </div>
</body>
</html>
