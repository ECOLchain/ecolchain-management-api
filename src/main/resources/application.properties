# ------------------------------------------------------------------
# Quarkus profiles: dev (local e deploy dev), prod, test
# Credenciais S3 ficam fora daqui: .env (gitignored) -> QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID / _SECRET_ACCESS_KEY
# ------------------------------------------------------------------

quarkus.datasource.db-kind=oracle

# Ambiente sem Docker: desliga todos os DevServices (datasource real, S3 real)
quarkus.devservices.enabled=false

# Oracle ADB 23ai (ecolmgmt) - one-way TLS na porta 1521, sem wallet.
# Mesma URL para dev e prod; separacao por usuario/schema.
ecolchain.db.url=jdbc:oracle:thin:@(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1521)(host=adb.sa-saopaulo-1.oraclecloud.com))(connect_data=(service_name=g8e4ca2098abef7_ecolmgmt_tp.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))

# Schema gerenciado por Flyway (ver db/bootstrap/ para criacao dos usuarios)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# OCI Object Storage (S3-compat) - regiao de assinatura = sa-saopaulo-1
quarkus.s3.endpoint-override=https://grmykw8bmw9d.compat.objectstorage.sa-saopaulo-1.oraclecloud.com
quarkus.s3.aws.region=sa-saopaulo-1
quarkus.s3.path-style-access=true
quarkus.s3.aws.credentials.type=static
quarkus.s3.devservices.enabled=false

app.docs.upload-url-ttl=10m
app.docs.download-url-ttl=5m
app.docs.max-size-bytes=26214400

# --- JWT (RS256) — chaves commitadas por decisao do dono (MVP; proposta C.1) ---
mp.jwt.verify.issuer=ecolchain-management-api
mp.jwt.verify.audiences=ecolchain-app
smallrye.jwt.new-token.issuer=ecolchain-management-api
smallrye.jwt.new-token.audience=ecolchain-app
smallrye.jwt.new-token.lifespan=900
%dev.mp.jwt.verify.publickey.location=keys/jwt-public-dev.pem
%dev.smallrye.jwt.sign.key.location=keys/jwt-private-dev.pem
%dev.smallrye.jwt.new-token.key-id=ecolchain-dev-1
%prod.mp.jwt.verify.publickey.location=keys/jwt-public-prod.pem
%prod.smallrye.jwt.sign.key.location=keys/jwt-private-prod.pem
%prod.smallrye.jwt.new-token.key-id=ecolchain-prod-1
%test.mp.jwt.verify.publickey.location=keys/jwt-public-dev.pem
%test.smallrye.jwt.sign.key.location=keys/jwt-private-dev.pem
%test.smallrye.jwt.new-token.key-id=ecolchain-dev-1

# --- Seguranca HTTP: auth lazy p/ responder envelope RFC9457 nos 401/403;
# --- deny-by-default fica no AuthFilter (lista de paths publicos la) ---
quarkus.http.auth.proactive=false

# --- CORS: SPA em dev; prod sem origens ate o dominio existir ---
quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,PUT,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
%dev.quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000

# --- Politica de auth (proposta C.3) ---
app.auth.otp.ttl=PT10M
app.auth.otp.max-attempts=5
app.auth.otp.resend-cooldown=PT60S
app.auth.otp.max-per-hour=5
app.auth.otp.ip-max-per-hour=20
app.auth.otp.daily-global-cap=180
app.auth.otp.pepper=${OTP_PEPPER:ecolchain-mvp-dev-pepper}
app.auth.refresh.ttl=P7D
app.auth.refresh.family-ttl=P30D
app.auth.refresh.cookie-name=ecolchain_refresh
app.auth.refresh.cookie-secure=true
app.auth.terms-version=v1-placeholder
app.cnpj.lookup.enabled=false

# Ferramenta de dev/E2E: expõe a caixa de saída quando o mailer esta mockado
%dev.app.dev-tools.mailbox-enabled=true
%test.app.dev-tools.mailbox-enabled=true

# OCI Email Delivery - SMTP 465 com TLS implicito (ver docs/email-delivery.md).
# Credenciais ficam no .env: QUARKUS_MAILER_USERNAME / QUARKUS_MAILER_PASSWORD.
# Sem distincao dev/prod no inicio: mesma config e envio real em todos os profiles.
quarkus.mailer.host=smtp.email.sa-saopaulo-1.oci.oraclecloud.com
quarkus.mailer.port=465
quarkus.mailer.tls=true
quarkus.mailer.login=REQUIRED
quarkus.mailer.from=ECOLchain <ecolchain@ecolchain.com>
quarkus.mailer.mock=false

# --- dev: local (quarkus:dev) e deploy dev (QUARKUS_PROFILE=dev) ---
# DevServices de observabilidade (LGTM/Grafana) tem flag propria, so existe em dev mode
%dev.quarkus.observability.enabled=false
%dev.quarkus.datasource.jdbc.url=${ecolchain.db.url}
%dev.quarkus.datasource.username=MGMT_DEV
%dev.quarkus.datasource.password=EcolchainDev#2026x
%dev.quarkus.datasource.jdbc.max-size=5
%dev.app.docs.bucket=ecolchain-bucket-docs-dev

# --- prod ---
%prod.quarkus.datasource.jdbc.url=${ecolchain.db.url}
%prod.quarkus.datasource.username=MGMT_PROD
%prod.quarkus.datasource.password=EcolchainProd#2026x
%prod.quarkus.datasource.jdbc.max-size=10
%prod.app.docs.bucket=ecolchain-bucket-docs-prod

# --- test: sem banco real, sem docker, sem nuvem ---
%test.quarkus.mailer.mock=true
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.flyway.active=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test-access-key
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test-secret-key
%test.app.docs.bucket=ecolchain-bucket-docs-test
