# ------------------------------------------------------------------
# Quarkus profiles: dev (local e deploy dev), prod, test
# Credenciais S3 ficam fora daqui: .env (gitignored) -> QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID / _SECRET_ACCESS_KEY
# ------------------------------------------------------------------

quarkus.datasource.db-kind=oracle

# Ambiente sem Docker: desliga todos os DevServices (datasource real, S3 real)
quarkus.devservices.enabled=false

# Oracle ADB 23ai (ecolmgmt) - one-way TLS na porta 1521, sem wallet.
# Mesma URL para dev e prod; separacao por usuario/schema.
ecolchain.db.url=jdbc:oracle:thin:@(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1521)(host=adb.sa-saopaulo-1.oraclecloud.com))(connect_data=(service_name=g8e4ca2098abef7_ecolmgmt_tp.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))

# Schema gerenciado por Flyway (ver db/bootstrap/ para criacao dos usuarios)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# OCI Object Storage (S3-compat) - regiao de assinatura = sa-saopaulo-1
quarkus.s3.endpoint-override=https://grmykw8bmw9d.compat.objectstorage.sa-saopaulo-1.oraclecloud.com
quarkus.s3.aws.region=sa-saopaulo-1
quarkus.s3.path-style-access=true
quarkus.s3.aws.credentials.type=static
quarkus.s3.devservices.enabled=false

app.docs.upload-url-ttl=10m
app.docs.download-url-ttl=5m
app.docs.max-size-bytes=26214400

# --- dev: local (quarkus:dev) e deploy dev (QUARKUS_PROFILE=dev) ---
# DevServices de observabilidade (LGTM/Grafana) tem flag propria, so existe em dev mode
%dev.quarkus.observability.enabled=false
%dev.quarkus.datasource.jdbc.url=${ecolchain.db.url}
%dev.quarkus.datasource.username=MGMT_DEV
%dev.quarkus.datasource.password=EcolchainDev#2026x
%dev.quarkus.datasource.jdbc.max-size=5
%dev.app.docs.bucket=ecolchain-bucket-docs-dev

# --- prod ---
%prod.quarkus.datasource.jdbc.url=${ecolchain.db.url}
%prod.quarkus.datasource.username=MGMT_PROD
%prod.quarkus.datasource.password=EcolchainProd#2026x
%prod.quarkus.datasource.jdbc.max-size=10
%prod.app.docs.bucket=ecolchain-bucket-docs-prod

# --- test: sem banco real, sem docker, sem nuvem ---
%test.quarkus.datasource.active=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test-access-key
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test-secret-key
%test.app.docs.bucket=ecolchain-bucket-docs-test
